[project]
name = "h5t"
version = "0.1.0"
description = "A schema layer for HDF5: declare structure and domain invariants as Python classes."
readme = "README.md"
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26",
]

[project.scripts]
h5t = "h5t._cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ty>=0.1",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D105", # missing docstring in magic method
    "D107", # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# B018 fires on attribute access inside pytest.raises blocks.
"tests/**" = ["D", "B018"]

[tool.ty.src]
include = ["src/h5t"]

[tool.pytest.ini_options]
testpaths = ["tests"]
