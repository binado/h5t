name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python-version }}
      # ruff and ty are version-independent here (target-version = "py311",
      # [tool.ty.src] is fixed), so one job covers them.
      - name: Lint
        if: matrix.python-version == '3.11'
        run: uv run ruff check .
      - name: Format
        if: matrix.python-version == '3.11'
        run: uv run ruff format --check src tests
      - name: Type check
        if: matrix.python-version == '3.11'
        run: uv run ty check
      - name: Test
        run: uv run pytest
