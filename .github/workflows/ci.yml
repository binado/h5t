name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python-version }}
      # ruff and ty are version-independent here (target-version = "py311",
      # [tool.ty.src] is fixed), so one job covers them.
      - name: Lint
        if: matrix.python-version == '3.11'
        run: uv run ruff check .
      - name: Format
        if: matrix.python-version == '3.11'
        run: uv run ruff format --check src tests
      - name: Type check
        if: matrix.python-version == '3.11'
        run: uv run ty check
      - name: Test
        run: uv run pytest

  minimum-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync at lowest direct dependency versions
        run: uv sync --resolution lowest-direct --python "3.11"
      - name: Test
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Verify py.typed and package contents
        run: |
          set -e
          wheel="$(ls dist/*.whl)"
          echo "wheel: $wheel"
          unzip -l "$wheel"
          unzip -l "$wheel" | grep -q "h5t/py.typed" || {
            echo "::error::py.typed marker missing from wheel"
            exit 1
          }
          sdist="$(ls dist/*.tar.gz)"
          echo "sdist: $sdist"
          tar tzf "$sdist"
